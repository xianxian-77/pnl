<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ede9e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="持仓盈亏">
<title>持仓盈亏</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<style>
  /* ── 视觉语言 ────────────────────────────────────────────────────────────
     米白纸面 · 编辑排版(发丝线分栏, 不用卡片盒) · 点阵数字 · 墨色药丸按钮
     色板按 Radix 的 12 阶分工组织: 1-2 底色 / 3-5 组件 / 6-8 描边 / 9 实心 / 11-12 文字。
     关键: 文字色和实心色必须分开取 —— 旧版红 #c93a2e 在米白底上只有 4.16:1, 正文不达标。 */
  :root {
    color-scheme: light;
    /* 1-2 底色 */
    --bg: #ece8df;  --bg-raised: #f4f0e7;
    /* 3-5 组件底(常态/悬停/按下) */
    --el: #e5e0d5;  --el-hover: #ded8ca;  --el-active: #d5cebd;
    /* 6-8 描边(静态/可交互/焦点环) */
    --line: #d6d0c2;  --line-strong: #bdb5a2;  --focus: #8f8672;
    /* 9 实心 / 11 弱文字 / 12 主文字 */
    --solid: #8a8271;  --text-dim: #6d685d;  --text-2: #57534a;  --text: #191713;
    --rule: #191713;                       /* 编辑排版的粗正文线 */
    /* 涨跌: 11 阶给文字(≥4.5:1), 9 阶给实心色块 */
    --up-text: #b02a1c;   --up-solid: #cf4536;    /* 实测 5.38:1 */
    --down-text: #14603a; --down-solid: #1d7a4c;  /* 实测 6.21:1 */
    --accent: #b0431f;
    --pill: #191713; --pill-ink: #f4f0e7;
    --wash: rgba(25,23,19,.035);
    --flash: rgba(176,67,31,.14);
    /* 字号阶梯 */
    --t-xs: 10.5px; --t-sm: 12px; --t-base: 13.5px; --t-md: 15px;
    --t-lg: 19px; --t-xl: 25px;
    /* 间距阶梯(4px 基) */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    /* 动效: Emil 的原则 —— 一律 ≤300ms + ease-out, 只动 transform/opacity */
    --ease: cubic-bezier(.16,.84,.44,1);
    --fast: .14s; --mid: .22s; --slow: .3s;
  }
  /* 涨跌语义色: 默认红涨绿跌(中文习惯); body.green-up 反转 */
  body          { --pos: var(--up-text);   --neg: var(--down-text);
                  --pos-solid: var(--up-solid);   --neg-solid: var(--down-solid); }
  body.green-up { --pos: var(--down-text); --neg: var(--up-text);
                  --pos-solid: var(--down-solid); --neg-solid: var(--up-solid); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: var(--t-md); line-height: 1.45;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: clip;
  }
  main { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px) var(--s7); position: relative; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .dotnum { display: block; max-width: 100%; height: auto; }
  .sym .dotnum, .wordmark .dotnum { display: inline-block; vertical-align: middle; }
  /* 通用小标签: 全站统一的"字段名"样式 */
  .eyebrow, .tile .label { font-size: var(--t-xs); letter-spacing: .1em; color: var(--text-dim); font-weight: 500; }

  /* ── 报头 ─────────────────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    padding: var(--s5) 2px var(--s3); flex-wrap: wrap;
    border-bottom: 1.5px solid var(--rule);
  }
  .brand { display: flex; align-items: center; gap: var(--s3); }
  .mark { width: 32px; height: 32px; background: var(--text); border-radius: 9px; position: relative; flex: none; }
  .mark::before, .mark::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--bg); border-radius: 1.5px;
  }
  .mark::before { width: 16px; height: 4px; }
  .mark::after { width: 4px; height: 16px; }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }
  .wordmark { color: var(--text-dim); margin-top: 3px; }
  .hdr-right { display: flex; align-items: center; gap: var(--s3); }
  #updated { font-size: var(--t-sm); color: var(--text-dim); font-variant-numeric: tabular-nums; }

  button {
    font: inherit; font-size: var(--t-base); color: var(--text); background: transparent;
    border: 1px solid var(--line-strong); border-radius: 999px;
    padding: 7px 16px; cursor: pointer; touch-action: manipulation;
    transition: opacity var(--fast) var(--ease), transform var(--fast) var(--ease);
  }
  button:active { transform: scale(.97); opacity: .8; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary, #refreshBtn { background: var(--pill); border-color: var(--pill); color: var(--pill-ink); font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  #refreshBtn.loading::after { content: "…"; }

  .banner {
    border-bottom: 1px solid var(--line);
    padding: var(--s3) 2px; font-size: var(--t-base); color: var(--text-2);
  }
  .banner .actions { margin-top: var(--s2); display: flex; gap: var(--s2); }

  /* ── 首屏: 数字为主角, 球群作陪衬 ──────────────────────────────────────
     旧版把渐变球做成满屏画布, 手机上要滑过 460px 才看得到第一个数字。
     现在数字永远在最前, 球群在桌面占右半、在手机压到 200px 放到数字之后。 */
  .hero { position: relative; padding: var(--s6) 0 var(--s5); }
  /* width:100% 是必须的: 不给宽度时 flex 会把它缩到内容宽(实测只剩 323px), 巨数就失去主角体量了 */
  .hero-main { position: relative; z-index: 1; width: 100%; max-width: 620px; min-width: 0; }
  .s-mark {
    width: 26px; height: 26px; border: 1.5px solid var(--text); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; line-height: 1; margin-bottom: var(--s4); color: var(--text);
  }
  /* L1 主数字: 全页最大, 一眼定位 */
  .hero-fig { margin: var(--s2) 0 var(--s3); }
  .hero-fig .dotnum { width: min(100%, 460px); }
  .hero-meta { font-size: var(--t-base); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .hero-meta b { font-weight: 650; }
  .hero-meta .sep { color: var(--line-strong); margin: 0 var(--s2); }
  /* L2 本周/今日: 并排两栏, 竖发丝线分隔 */
  .hero-splits {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    margin-top: var(--s5); border-top: 1px solid var(--line); max-width: 420px;
  }
  .split { padding: var(--s4) var(--s4) 0 0; }
  .split + .split { border-left: 1px solid var(--line); padding-left: var(--s4); }
  .split-fig { font-size: var(--t-xl); font-weight: 650; letter-spacing: -.02em;
               font-variant-numeric: tabular-nums; margin-top: var(--s2); line-height: 1.1; }
  .split-sub { font-size: var(--t-sm); margin-top: var(--s1); font-variant-numeric: tabular-nums; }
  .split-note { font-size: var(--t-xs); color: var(--text-dim); margin-top: 2px; }

  /* 球群画布 */
  .s-field { position: absolute; inset: 0 0 0 46%; z-index: 0; pointer-events: none; }
  .s-field .orb { pointer-events: auto; }
  .s-decor { position: absolute; border: 1px solid var(--line); border-radius: 50%;
             aspect-ratio: 1; transform: translate(-50%, -50%); pointer-events: none; }
  /* 命中区(按钮)固定不动, 视觉层(orb-vis)单独做模糊/漂浮/入场 —
     动画若挂在按钮上, 球会在光标下方来回移动导致 hover 反复进出 → 爆闪 */
  .orb { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%);
         cursor: pointer; border: none; padding: 0; background: none; }
  .orb::after { content: ""; position: absolute; inset: -14%; border-radius: 50%; }
  .orb:focus-visible { outline: none; }
  .orb-vis { display: block; width: 100%; height: 100%; border-radius: 50%;
             filter: blur(6px); transition: filter var(--mid) var(--ease); pointer-events: none; }
  .orb-vis.pos-orb  { background: radial-gradient(circle at 44% 40%, var(--pos-solid) 0%, color-mix(in srgb, var(--pos-solid) 55%, transparent) 44%, transparent 71%); }
  .orb-vis.neg-orb  { background: radial-gradient(circle at 44% 40%, var(--neg-solid) 0%, color-mix(in srgb, var(--neg-solid) 55%, transparent) 44%, transparent 71%); }
  .orb-vis.flat-orb { background: radial-gradient(circle at 44% 40%, var(--solid) 0%, color-mix(in srgb, var(--solid) 55%, transparent) 44%, transparent 71%); }
  .orb:focus-visible .orb-vis { filter: blur(5px) saturate(1.35); }
  /* callout 位置渲染后实测再定(首屏纵横比随窗口变), 定位前不可见 */
  .callout { position: absolute; transform: translateX(-50%); text-align: center;
             pointer-events: none; white-space: nowrap; z-index: 2; visibility: hidden; }
  .callout .pct { font-size: var(--t-lg); font-weight: 650; letter-spacing: -.01em; }
  .callout .pctsign { font-size: var(--t-sm); font-weight: 600; vertical-align: super; }
  .callout .cap { font-size: var(--t-xs); letter-spacing: .06em; color: var(--text-dim); margin-top: 1px; }
  .chart-tip {
    position: absolute; transform: translate(-50%, -130%);
    background: var(--pill); color: var(--pill-ink); font-size: var(--t-sm);
    padding: 5px 11px; border-radius: 999px; white-space: nowrap; pointer-events: none; z-index: 5;
  }

  /* ── L3 统计条: 已实现/未实现 ─────────────────────────────────────── */
  .tiles {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    border-top: 1.5px solid var(--rule); border-bottom: 1px solid var(--line);
  }
  .tile { padding: var(--s4) var(--s4) var(--s4) 0; min-width: 0; }
  .tile:not(:first-child) { border-left: 1px solid var(--line); padding-left: var(--s4); }
  .tile .label { display: block; margin-bottom: var(--s2); }
  .tile .value { font-size: var(--t-lg); font-weight: 650; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .tile.hero { grid-column: 1 / -1; border-left: none; padding: var(--s4) 0; }
  .tile .delta { font-size: var(--t-sm); margin-top: var(--s2); font-variant-numeric: tabular-nums; color: var(--text-dim); }

  /* ── 板块分布 ─────────────────────────────────────────────────────── */
  .sectorWrap { margin-top: var(--s5); }
  .sec-bar { display: flex; gap: 2px; height: 14px; border-radius: 3px; overflow: hidden; }
  .sec-bar .seg { display: block; height: 100%; background: var(--text); min-width: 3px; }
  .sec-legend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); margin-top: var(--s3); font-size: var(--t-sm); color: var(--text-2); }
  .sleg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--text); margin-right: 6px; vertical-align: -1px; }
  .sleg b { font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }

  /* ── 区块小标题 ───────────────────────────────────────────────────── */
  .kicker {
    display: flex; align-items: baseline; gap: var(--s3);
    padding: var(--s6) 2px var(--s2); font-size: var(--t-base); font-weight: 700; letter-spacing: .01em;
  }
  .kicker .en { font-weight: 400; font-size: var(--t-xs); letter-spacing: .14em; color: var(--text-dim); }

  /* ── 持仓明细 ─────────────────────────────────────────────────────── */
  .holdings { margin-bottom: var(--s5); }
  .hrow-head, .hrow {
    display: grid; align-items: center; gap: var(--s1) var(--s3);
    padding: var(--s3) 2px;
    grid-template-columns: minmax(84px, 1.1fr) 84px 1fr .75fr .75fr 1fr 1fr;
  }
  .hrow-head { font-size: var(--t-xs); letter-spacing: .07em; color: var(--text-dim);
               border-top: 1.5px solid var(--rule); border-bottom: 1px solid var(--line); padding: var(--s2) 2px; }
  .hrow { border-bottom: 1px solid var(--line); cursor: pointer; touch-action: manipulation;
          transition: background-color var(--fast) var(--ease); }
  .hrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .hrow:last-child { border-bottom: none; }
  .hrow > div { min-width: 0; }
  .sym { font-weight: 650; }
  .sym .name { display: block; font-size: var(--t-xs); color: var(--text-dim); font-weight: 400;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { display: block; font-size: var(--t-sm); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .price-cell .manual-mark { font-size: var(--t-xs); color: var(--text-dim); white-space: nowrap; display: inline-block; }
  .editp { font-size: var(--t-sm); line-height: 1; padding: 6px 7px; margin-left: 4px;
           border: none; background: none; color: var(--text-dim); vertical-align: baseline; }
  .meter { height: 4px; border-radius: 2px; background: var(--el); margin-top: 4px; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: var(--text); border-radius: 2px; transform-origin: left; }
  .c-spark { min-width: 0; }
  .spark { display: block; overflow: visible; }
  .spark polyline { stroke: var(--text-2); opacity: .7; }
  .spark circle { fill: currentColor; }
  .c-spark.pos { color: var(--pos); }
  .c-spark.neg { color: var(--neg); }
  .earnchip { color: var(--text-dim); letter-spacing: .02em; }
  .earnchip.soon { color: var(--accent); font-weight: 600; }

  .lots { grid-column: 1 / -1; padding: var(--s1) 0 var(--s2); font-size: var(--t-base); color: var(--text-2);
          cursor: default; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .lots table { width: 100%; border-collapse: collapse; }
  .lots td, .lots th { white-space: nowrap; }
  .lots .note { font-size: var(--t-sm); color: var(--text-dim); margin-top: 4px; white-space: normal; }
  .lots th { font-weight: 400; color: var(--text-dim); font-size: var(--t-sm); text-align: right; padding: 3px 6px; }
  .lots th:first-child, .lots td:first-child { text-align: left; }
  .lots td { padding: 3px 6px; text-align: right; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
  .lots .sell td { color: var(--text-dim); }
  .lots .desc { font-size: var(--t-base); line-height: 1.75; color: var(--text-2);
                padding: var(--s2) 0 var(--s3); white-space: normal; max-width: 660px; }
  .lots .desc a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .flat-note { font-size: var(--t-sm); color: var(--text-dim); padding: var(--s2) 2px; border-top: 1px solid var(--line); }

  /* ── 盈亏分布: 渐隐柱(盈利向上/亏损向下, 方向+颜色双编码) ──────────── */
  /* 柱子有 50px 保底宽(百分比文字不叠压), 塞不下时容器横向滑动 */
  .pc-cols { display: flex; gap: var(--s3); align-items: stretch; height: 240px; padding-top: var(--s2);
             overflow-x: auto; scrollbar-width: thin; }
  .pc-col { flex: 1 0 50px; max-width: 64px; min-width: 0; display: grid; grid-template-rows: 1fr auto 1fr;
            cursor: pointer; border: none; background: none; padding: 0; font: inherit; color: inherit; }
  .pc-col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pc-half { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-height: 0; }
  .pc-half.pc-down { justify-content: flex-start; }
  .pc-bar { display: block; width: 100%; border-radius: 2px; transition: opacity var(--fast) var(--ease); }
  .pc-bar.pc-pos { background: linear-gradient(to top, var(--pos-solid) 4%, transparent 96%); transform-origin: bottom; }
  .pc-bar.pc-neg { background: linear-gradient(to bottom, var(--neg-solid) 4%, transparent 96%); transform-origin: top; }
  .pc-val { font-size: var(--t-xs); font-variant-numeric: tabular-nums; white-space: nowrap; padding: 3px 0; }
  .pc-lab { font-size: var(--t-xs); letter-spacing: .08em; color: var(--text-dim); text-align: center;
            padding: 6px 2px; border-top: 1px solid var(--line);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── 记一笔 ───────────────────────────────────────────────────────── */
  .tradeWrap { margin-top: var(--s6); border-top: 1.5px solid var(--rule); }
  .trade { display: flex; gap: var(--s4); align-items: flex-end; flex-wrap: wrap; margin-top: var(--s1); }
  .trade label { display: flex; flex-direction: column; gap: 6px; font-size: var(--t-sm); color: var(--text-dim);
                 flex: 1; min-width: 140px; max-width: 260px; }
  .trade input {
    font: inherit; font-size: 16px; /* iOS Safari 对 <16px 的输入框聚焦时会强制放大页面 */
    color: var(--text); background: var(--bg-raised);
    border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; width: 100%;
    transition: border-color var(--fast) var(--ease);
  }
  .trade input:focus { outline: none; border-color: var(--text); }
  .trade-btns { display: flex; gap: var(--s3); padding-bottom: 1px; }
  #sellBtn { border-color: var(--text); }
  .hint { font-size: var(--t-sm); color: var(--text-dim); margin: var(--s2) 0; }

  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(8px);
    background: var(--pill); color: var(--pill-ink); font-size: var(--t-base);
    padding: 9px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity var(--mid) var(--ease), transform var(--mid) var(--ease);
    max-width: 86vw; z-index: 20;
  }
  .toast.show { opacity: .96; transform: translateX(-50%) translateY(0); }

  /* ── 宽屏横构图 ───────────────────────────────────────────────────── */
  @media (min-width: 900px) {
    .hero { min-height: 420px; display: flex; align-items: center; }
    .pc-cols { height: 280px; }
  }
  /* 两栏并排要到 1120px 才开: 更窄时持仓明细的 7 列塞不下(实测 552px 是下限), 宁可单栏也不撞车。
     ★ min-width:0 不能少 —— 网格子项默认 min-width:auto, 盈亏分布图 13 根柱子会把自己
     撑到 ~670px 抢走空间, 实测把持仓明细挤到 466px 导致列重叠、960px 时整页横向溢出。 */
  @media (min-width: 1120px) {
    .mainCols { display: grid; grid-template-columns: 7fr 5fr; gap: 0 var(--s7); align-items: start; }
    .mainCols > * { min-width: 0; }
    .pnlWrap { position: sticky; top: var(--s3); }
  }
  @media (min-width: 1100px) {
    .hero-fig .dotnum { width: min(100%, 520px); }
  }

  /* ── 手机: 数字前置, 球群压缩后置 ─────────────────────────────────── */
  @media (max-width: 899.98px) {
    .hero { padding: var(--s5) 0 var(--s4); }
    /* 球群从背景层改成正常流里的一块, 高度砍到 200px 并排在数字之后 */
    .s-field { position: relative; inset: auto; height: 200px; margin-top: var(--s5);
               border-top: 1px solid var(--line); }
    .hero-splits { max-width: none; }
    .callout .pct { font-size: 16px; }
    .callout .cap { font-size: 9px; }
  }
  @media (max-width: 639.98px) {
    header { padding-top: var(--s4); }
    .hero-fig .dotnum { width: min(100%, 300px); }
    .split-fig { font-size: var(--t-lg); }
    .hrow-head { display: none; }
    .hrow {
      grid-template-columns: 1fr auto;
      grid-template-areas: "sym price" "meta meta" "spark spark" "value pnl" "lots lots";
      padding: var(--s4) 2px;
    }
    .hrow .c-sym   { grid-area: sym; }
    .hrow .c-spark { grid-area: spark; margin-top: 6px; }
    .hrow .c-spark svg { width: 120px; height: auto; }
    .hrow .c-spark:empty { display: none; }
    .hrow .c-price { grid-area: price; text-align: right; }
    .hrow .c-meta  { grid-area: meta; display: flex; gap: var(--s4); font-size: var(--t-sm); color: var(--text-2); margin-top: 2px; }
    .hrow .c-value { grid-area: value; text-align: left; margin-top: 4px; }
    .hrow .c-pnl   { grid-area: pnl; text-align: right; margin-top: 4px; }
    .hrow .lots    { grid-area: lots; }
    .hrow .c-value .meter { max-width: 120px; }
  }
  @media (min-width: 640px) {
    .hrow .c-meta { display: contents; }
    .mlabel { display: none; } /* 桌面表头已有「均价」列名 */
  }

  /* ── 动效 ─────────────────────────────────────────────────────────
     Emil 的原则: 时长 ≤300ms, ease-out, 只动 transform/opacity(不触发重排),
     用 CSS transition 保证随时可打断; 系统开了"减少动态"就全部静止。 */
  @media (hover: hover) {
    /* ★ .orb/.pc-col 必须排除: 它们靠 transform 定位, 通用 hover 位移会把 transform 整个替换掉,
       球体瞬移出光标 → hover 反复进出 → 爆闪 */
    button:not(:disabled):not(.orb):not(.pc-col):hover { transform: translateY(-1px); }
    .hrow:hover { background: var(--wash); }
    .orb:hover .orb-vis { filter: blur(5px) saturate(1.35); }
    .pc-col:hover .pc-bar { opacity: .72; }
  }
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity var(--slow) var(--ease), transform var(--slow) var(--ease); }
  .reveal.inview { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    body.boot .hero-main, body.boot .tiles, body.boot .sectorWrap {
      animation: fadeUp var(--slow) var(--ease) both;
    }
    body.boot .tiles { animation-delay: 90ms; }
    body.boot .sectorWrap { animation-delay: 140ms; }
    body.boot .hero-fig .dotnum circle, body.boot .tile .dotnum circle { animation: dotIn .3s ease-out both; }
    body.tick .hero-fig .dotnum circle, body.tick .tile .dotnum circle { animation: dotIn .28s ease-out both; }
    /* 漂浮/入场只挂在视觉层(orb-vis), 全用独立 scale/translate 通道, 不碰按钮定位 */
    .orb-vis { animation: orbDrift 9s ease-in-out infinite alternate both; animation-delay: var(--d, 0ms); }
    body.boot .orb-vis {
      animation: orbIn .5s var(--ease) both, orbDrift 9s ease-in-out infinite alternate both;
      animation-delay: var(--d, 0ms), calc(var(--d, 0ms) + .5s);
    }
    body.boot .callout { animation: calloutIn .3s var(--ease) .35s both; }
    body.boot .pc-bar { animation: growV var(--slow) var(--ease) both; animation-delay: var(--d, 0ms); }
    body.boot .hrow { animation: fadeUp .28s var(--ease) both; animation-delay: var(--d, 0ms); }
    body.boot .meter > i { animation: growH var(--slow) var(--ease) .2s both; }
    body.boot .spark polyline { stroke-dasharray: 1; stroke-dashoffset: 1; animation: dash .6s ease-out .3s forwards; }
    body.boot .spark circle { animation: dotIn .3s ease-out .8s both; }
    #refreshBtn.loading { animation: pulse 1.1s ease-in-out infinite; }
    .lots-in { animation: fadeDown .2s var(--ease) both; }
    .hrow.flash { animation: flashBg .9s ease-out; }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-4px); } }
  @keyframes dotIn { from { opacity: 0; } }
  /* orb-vis 无定位 transform, 入场用独立 scale, 漂移用独立 translate, 两通道互不干扰 */
  @keyframes orbIn { from { opacity: 0; scale: .35; } }
  @keyframes orbDrift { from { translate: 2px -4px; } to { translate: -3px 5px; } }
  @keyframes growH { from { transform: scaleX(0); } }
  @keyframes growV { from { transform: scaleY(0); } }
  @keyframes dash { to { stroke-dashoffset: 0; } }
  @keyframes pulse { 50% { opacity: .55; } }
  /* callout 的入场不许碰 transform(定位靠它), 用独立 translate */
  @keyframes calloutIn { from { opacity: 0; translate: 0 8px; } to { translate: 0 0; } }
  @keyframes flashBg { 0% { background-color: var(--flash); } 100% { background-color: transparent; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>持仓盈亏</h1>

  <section class="hero" id="structure" style="display:none"></section>
  <section class="tiles" id="tiles"></section>

  <div class="mainCols">
    <div class="holdWrap">
      <div class="kicker">持仓明细 <span class="en">HOLDINGS</span></div>
      <section class="holdings" id="holdings"></section>
    </div>
    <aside class="pnlWrap" id="pnlWrap" style="display:none">
      <div class="kicker">盈亏分布 <span class="en">P&amp;L BY HOLDING</span></div>
      <section class="pnlchart" id="pnlchart"></section>
    </aside>
  </div>

  <section class="tradeWrap">
    <div class="kicker">记一笔 <span class="en">NEW TRADE</span></div>
    <form class="trade" id="tradeForm" onsubmit="return false">
      <label>股票代码<input id="tSym" autocomplete="off" spellcheck="false" placeholder="如 QQQ / 0700.HK"></label>
      <label>价格<input id="tPrice" type="number" step="any" min="0" inputmode="decimal" placeholder="成交价"></label>
      <label>数量<input id="tQty" type="number" step="any" min="0" inputmode="decimal" placeholder="股数"></label>
      <label>板块（选填）<input id="tTag" list="tagList" autocomplete="off" placeholder="如 军工 / ETF / 黄金"></label>
      <datalist id="tagList"><option value="科技"><option value="半导体"><option value="ETF"><option value="黄金"><option value="军工"><option value="加密概念"><option value="医药"><option value="消费"><option value="能源"><option value="金融"><option value="汽车"></datalist>
      <div class="trade-btns">

      </div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===CORE-START=== 纯计算逻辑, 无 DOM 依赖 (node 可测) */
const CORE = (() => {

  // "29/6/2026" | "2026-6-29" | "2026/6/29" → {y,m,d} 或 null
  function parseDate(s) {
    const m = String(s).trim().match(/^(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})$/);
    if (!m) return null;
    let a = +m[1], b = +m[2], c = +m[3], y, mo, d;
    if (a >= 1000) { y = a; mo = b; d = c; }            // 2026-6-29
    else if (c >= 1000) {                                // ?/?/2026
      y = c;
      if (a > 12 && b <= 12) { d = a; mo = b; }          // 29/6 → 日/月
      else if (a <= 12 && b > 12) { mo = a; d = b; }     // 6/29 → 月/日
      else { d = a; mo = b; }                            // 都 ≤12 → 按 日/月
    } else return null;
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return { y, m: mo, d };
  }

  const DATE_RE = /^\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4}$/;
  const SYM_RE  = /^[A-Za-z0-9][A-Za-z0-9.\-^=]*$/;
  const NUM_RE  = /^-?\d+(?:\.\d+)?$/;

  // 文本 → { lots: [{sym, price, qty, date, dateStr, line}], warnings: [] }
  function parseHoldings(text) {
    const lots = [], warnings = [];
    const lines = String(text || "").split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i].trim();
      if (!raw || raw.startsWith("#")) continue;
      let toks = raw.split(/[,，\t]+|\s+/).filter(Boolean);

      // 行首序号: 首个 token 是纯整数, 且去掉它之后仍有 代码 + 至少两个数字(价格/股数) → 丢弃
      // (不能只认日期: "1 MU 1045 1" 这种带序号无日期的行, 否则序号会被当成价格)
      if (toks.length >= 4 && /^\d{1,5}$/.test(toks[0])) {
        const rest = toks.slice(1);
        const hasSym = rest.some(t => /[A-Za-z]/.test(t) && SYM_RE.test(t));
        const numCnt = rest.filter(t => NUM_RE.test(t)).length;
        if (hasSym && numCnt >= 2) toks = rest;
      }

      let dateStr = null, sym = null, tag = null;
      const nums = [];
      for (const t of toks) {
        if (dateStr === null && DATE_RE.test(t) && parseDate(t)) { dateStr = t; continue; }
        if (sym === null && /[A-Za-z]/.test(t) && SYM_RE.test(t)) { sym = t.toUpperCase(); continue; }
        if (NUM_RE.test(t)) { nums.push(parseFloat(t)); continue; }
        if (tag === null) { tag = t; continue; } // 首个多余 token = 板块标签 (如 军工/ETF/黄金)
      }
      if (!sym || nums.length < 2) {
        warnings.push(`第 ${i + 1} 行无法识别: 「${raw}」`);
        continue;
      }
      const price = nums[0], qty = nums[1];
      if (!(price > 0) || !isFinite(qty) || qty === 0) {
        warnings.push(`第 ${i + 1} 行价格/股数无效: 「${raw}」`);
        continue;
      }
      if (!dateStr) warnings.push(`第 ${i + 1} 行没有日期（仍已计入）: 「${raw}」`);
      const pd = dateStr ? parseDate(dateStr) : null;
      lots.push({
        sym, price, qty, dateStr: dateStr || "",
        dateKey: pd ? pd.y * 10000 + pd.m * 100 + pd.d : 0,
        line: i, tag,
      });
    }
    return { lots, warnings };
  }

  // lots → 每代码持仓 (均价成本法; 负 qty 卖出按均价结转)
  // todayKey (yyyymmdd 整数, 可选): 单独记录今天买入的股数/成本, 供「今日盈亏」按买入价而非昨收算
  function aggregate(lots, todayKey) {
    const bySym = new Map();
    const sorted = [...lots].sort((a, b) => (a.dateKey - b.dateKey) || (a.line - b.line));
    const warnings = [];
    for (const lot of sorted) {
      let p = bySym.get(lot.sym);
      if (!p) { p = { sym: lot.sym, shares: 0, cost: 0, buyCost: 0, sellProceeds: 0, realized: 0, todayQty: 0, todayCost: 0, hasSells: false, sector: null, lots: [] }; bySym.set(lot.sym, p); }
      if (lot.tag) p.sector = lot.tag; // 按时间序, 最新标签生效
      if (lot.qty > 0) {
        p.shares += lot.qty;
        p.cost += lot.qty * lot.price;
        p.buyCost += lot.qty * lot.price; // 累计买入总额, 卖出不扣减
        if (todayKey && lot.dateKey === todayKey) { p.todayQty += lot.qty; p.todayCost += lot.qty * lot.price; }
      } else {
        p.hasSells = true;
        let q = -lot.qty;
        if (q > p.shares + 1e-9) {
          warnings.push(`${lot.sym} ${lot.dateStr || ""} 卖出 ${q} 股超过持有量，按 ${round6(p.shares)} 股计`.trim());
          q = p.shares;
        }
        const avg = p.shares > 0 ? p.cost / p.shares : 0;
        p.realized += q * (lot.price - avg);
        p.sellProceeds += q * lot.price; // 卖出回款(含本金+利润), 净投入本金 = buyCost - sellProceeds, 滚仓(卖了再买)会自动抵消, 不会虚增
        p.shares -= q;
        p.cost = p.shares * avg;
        if (p.shares < 1e-9) { p.shares = 0; p.cost = 0; }
        // 卖出视为先卖掉今天之前的持仓; 若剩余不足, 今天买入的部分按比例缩
        if (p.todayQty > p.shares) {
          p.todayCost = p.todayQty > 0 ? p.todayCost * (p.shares / p.todayQty) : 0;
          p.todayQty = p.shares;
        }
      }
      p.lots.push(lot);
    }
    const positions = [...bySym.values()];
    for (const p of positions) p.avg = p.shares > 0 ? p.cost / p.shares : 0;
    return { positions, warnings };
  }

  function round6(x) { return Math.round(x * 1e6) / 1e6; }

  // 代码后缀 → 币种 (无行情时的兜底推断)
  const SUFFIX_CUR = { HK: "HKD", L: "GBP", T: "JPY", SS: "CNY", SZ: "CNY", TO: "CAD", AX: "AUD", DE: "EUR", PA: "EUR", AS: "EUR", MI: "EUR", SW: "CHF" };
  function inferCurrency(sym) {
    const m = String(sym).match(/\.([A-Za-z]+)$/);
    return (m && SUFFIX_CUR[m[1].toUpperCase()]) || "USD";
  }

  // 持仓 + 行情 → 展示行 + 汇总(按币种)
  // quotes: { SYM: {price, prevClose, currency, name, manual?} }
  function computeView(positions, quotes) {
    const curOf = p => (quotes[p.sym] && quotes[p.sym].currency) || inferCurrency(p.sym);
    // totals 用无原型对象: 币种字符串来自网络, 防 "constructor" 之类命中 Object.prototype
    const totals = Object.create(null);
    const bucket = cur => totals[cur] || (totals[cur] = { cost: 0, value: 0, unreal: 0, realized: 0, invested: 0, dayPnl: 0, prevValue: 0, valuedRows: 0, dayRows: 0 });

    const rows = [], flats = [], missing = [];
    for (const p of positions) {
      const q = quotes[p.sym];
      if (p.shares <= 0) { if (Math.abs(p.realized) > 1e-9) flats.push({ ...p, cur: curOf(p) }); continue; }
      const row = { ...p, quote: q || null, cur: curOf(p) };
      if (q && q.price > 0) {
        row.value = q.price * p.shares;
        row.unreal = row.value - p.cost;
        row.unrealPct = p.cost > 0 ? row.unreal / p.cost : 0;
        // 今日盈亏: 今天买入的部分按买入价算, 之前的持仓按昨收算
        const todayQty = Math.min(p.todayQty || 0, p.shares);
        const beforeQty = p.shares - todayQty;
        const todayAvg = (p.todayQty || 0) > 0 ? p.todayCost / p.todayQty : 0;
        if (q.prevClose > 0 || beforeQty === 0) {
          row.dayPnl = (beforeQty > 0 ? (q.price - q.prevClose) * beforeQty : 0) + (q.price - todayAvg) * todayQty;
          row.dayBase = (beforeQty > 0 ? q.prevClose * beforeQty : 0) + todayAvg * todayQty;
          row.dayPct = row.dayBase > 0 ? row.dayPnl / row.dayBase : null;
        }
      } else missing.push(p.sym);
      rows.push(row);
    }
    rows.sort((a, b) => (b.value || -1) - (a.value || -1));

    // 按币种汇总 (只计有报价的行)
    for (const r of rows) {
      if (r.value == null) continue;
      const t = bucket(r.cur);
      t.cost += r.cost; t.value += r.value; t.unreal += r.unreal; t.valuedRows++;
      if (r.dayPnl != null) { t.dayPnl += r.dayPnl; t.prevValue += r.dayBase; t.dayRows++; }
    }
    // realized 累加(含已清仓), 每代码一次; invested 用净投入本金(买入-卖出回款)
    // 而不是累计买入总额 —— 滚仓(卖出后用回款接着买)会让"累计买入总额"越滚越大,
    // 分母虚增会把百分比越滚越低, 净投入本金会随卖出正确抵消, 只反映真金白银放进去过多少
    for (const p of [...rows, ...flats]) {
      if (Math.abs(p.realized) > 1e-9) bucket(p.cur).realized += p.realized;
      if (p.buyCost > 0 || p.sellProceeds > 0) bucket(p.cur).invested += p.buyCost - p.sellProceeds;
    }
    for (const cur of Object.keys(totals)) {
      const t = totals[cur];
      t.unrealPct = t.cost > 0 ? t.unreal / t.cost : 0;
      t.dayPct = t.prevValue > 0 ? t.dayPnl / t.prevValue : null;
      t.dayPartial = t.valuedRows - t.dayRows; // 有市值但没进今日统计的行数
      // 总盈亏 = 已实现 + 未实现(仅算有报价的持仓); 百分比对净投入本金算
      t.totalPnl = t.unreal + t.realized;
      t.totalPct = t.invested > 0 ? t.totalPnl / t.invested : null;
    }
    // 占比
    for (const r of rows) {
      if (r.value == null) continue;
      r.alloc = totals[r.cur].value > 0 ? r.value / totals[r.cur].value : 0;
    }
    return { rows, flats, totals, missing };
  }

  // ---- 某个历史时点的总盈亏(已实现+未实现) ----
  // 用来做"本周收益"这类区间差值: 本周收益 = 现在的总盈亏 − 上周五收盘时的总盈亏。
  // 这个口径对期间的买卖免疫 —— 建仓那一刻浮盈是 0, 卖出那一刻只是浮盈转已实现, 两者都不改变总盈亏,
  // 所以差值里剩下的纯粹是"这段时间价格走出来的钱", 不会被入金/滚仓污染。
  // beforeKey: yyyymmdd, 只算这天之前的交易; px: {SYM: 该时点收盘价}; symOk: 可选的代码过滤(分币种用)
  // 返回 {pnl, value}: pnl 当时的累计总盈亏, value 当时的持仓市值(拿来当区间涨跌%的分母)
  // 任一当时持有的仓位缺历史价 → 返回 null (基准不完整就不能给数, 否则本周收益会凭空少一块)
  function pnlAt(lots, beforeKey, px, symOk) {
    const use = lots.filter(l => l.dateKey > 0 && l.dateKey < beforeKey && (!symOk || symOk(l.sym)));
    const { positions } = aggregate(use);
    let pnl = 0, value = 0;
    for (const p of positions) {
      pnl += p.realized || 0;
      if (p.shares > 1e-9) {
        const c = px[p.sym];
        if (!(c > 0)) return null;
        value += c * p.shares;
        pnl += c * p.shares - p.cost;
      }
    }
    return { pnl, value };
  }

  // ---- 格式化 ----
  // 注意: 不映射 "GBp"(便士) — 伦敦股报价在 fetchQuote 里已 ÷100 归一成 GBP
  const CUR_SYM = { USD: "$", HKD: "HK$", CNY: "¥", CNH: "¥", GBP: "£", EUR: "€", JPY: "¥", CAD: "C$", AUD: "A$", CHF: "CHF " };
  function fmtMoney(v, cur, opts) {
    if (v == null || !isFinite(v)) return "—";
    const sign = (opts && opts.signed) ? (v > 0 ? "+" : v < 0 ? "−" : "") : (v < 0 ? "−" : "");
    const abs = Math.abs(v);
    const dp = (opts && opts.dp != null) ? opts.dp : 2;
    const s = abs.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
    const symb = Object.prototype.hasOwnProperty.call(CUR_SYM, cur) ? CUR_SYM[cur] : (cur ? cur + " " : "$");
    return sign + symb + s;
  }
  function fmtPct(v, signed) {
    if (v == null || !isFinite(v)) return "—";
    const sign = signed === false ? "" : (v > 0 ? "+" : v < 0 ? "−" : "");
    return sign + (Math.abs(v) * 100).toFixed(2) + "%";
  }
  function fmtShares(v) {
    if (v == null || !isFinite(v)) return "—";
    return round6(v).toLocaleString("en-US", { maximumFractionDigits: 6 });
  }

  return { parseDate, parseHoldings, aggregate, computeView, pnlAt, inferCurrency, fmtMoney, fmtPct, fmtShares };
})();
if (typeof module !== "undefined" && module.exports) module.exports = CORE;
/* ===CORE-END=== */

/* ================= APP ================= */
(() => {
  if (typeof document === "undefined") return; // node 测试环境直接退出

  const $ = id => document.getElementById(id);
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  };
  const asObj = v => (v && typeof v === "object" && !Array.isArray(v)) ? v : {};

  // 币种字符串会进 innerHTML, 只放行纯字母代码 (行情经第三方代理, 不可信)
  function cleanCurrency(cur, sym) {
    return /^[A-Za-z]{2,5}$/.test(cur || "") ? cur : CORE.inferCurrency(sym);
  }
  // 消毒一份报价缓存 (来自网络或 localStorage): 非法项丢弃, GBp 便士归一成 GBP
  function sanitizeQuotes(raw) {
    const out = {};
    for (const [sym, q] of Object.entries(asObj(raw))) {
      if (!q || typeof q !== "object" || !(typeof q.price === "number" && q.price > 0)) continue;
      let { price, prevClose, currency, name, ts } = q;
      currency = cleanCurrency(currency, sym);
      if (q.currency === "GBp") { price /= 100; if (prevClose > 0) prevClose /= 100; currency = "GBP"; }
      out[sym] = {
        price,
        prevClose: (typeof prevClose === "number" && prevClose > 0) ? prevClose : null,
        currency,
        name: typeof name === "string" ? name : null,
        ts: typeof ts === "number" ? ts : 0,
        spark: Array.isArray(q.spark) ? q.spark.filter(v => typeof v === "number" && v > 0).slice(-40) : null,
        sparkTs: typeof q.sparkTs === "number" ? q.sparkTs : 0,
      };

  function usMarketActiveish() {

    if (day === 6 && h >= 1) return false;  // 周六凌晨收摊后

  async function tryExt(wrap, yUrl) {
    try {

      const ts = res.timestamp || [];
      const cl = (res.indicators && res.indicators.quote && res.indicators.quote[0] && res.indicators.quote[0].close) || [];
      let li = -1;
      for (let i = cl.length - 1; i >= 0; i--) if (typeof cl[i] === "number" && cl[i] > 0) { li = i; break; }
      if (li < 0) return null;

      if (Date.now() / 1000 - t > 4 * 3600) return null;
      let kind = null;
      if (tp.pre && tp.regular && t >= tp.pre.start && t < tp.regular.start) kind = "盘前";
      else if (tp.post && t >= tp.post.start) kind = "盘后";
      if (!kind) return null; // 常规时段/无延时成交 → 不覆盖

    } catch { return null; }

  /* ---- 本周收益的基准: 上周五(本周一之前最后一个交易日)的收盘价 ----
     "本周"按伦敦当地日历算, 周一为一周之始。基准日不写死成"周五": 从日线里取
     本周一之前的最后一根 bar, 碰上假期休市会自动往前顺延到真正的最后一个交易日。 */
  function weekAnchorKey() {
    const f = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit" });
    const [y, m, d] = f.format(new Date()).split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    const dow = dt.getUTCDay();                 // 0=周日
    dt.setUTCDate(dt.getUTCDate() - (dow === 0 ? 6 : dow - 1)); // 退回本周一
    return dt.getUTCFullYear() * 10000 + (dt.getUTCMonth() + 1) * 100 + dt.getUTCDate();
  }
  async function tryDaily(wrap, yUrl) {
    try {
      let j = JSON.parse(await fetchText(wrap(yUrl)));

      const ts = res.timestamp;
      const cl = res.indicators && res.indicators.quote && res.indicators.quote[0] && res.indicators.quote[0].close;
      if (!Array.isArray(ts) || !Array.isArray(cl)) return null;
      const div = res.meta && res.meta.currency === "GBp" ? 100 : 1; // 便士归一
      const out = [];
      for (let i = 0; i < ts.length; i++) {
        if (typeof cl[i] !== "number" || !(cl[i] > 0)) continue;
        const d = new Date(ts[i] * 1000); // 日线时间戳落在开盘时刻, UTC 日期即交易日
        out.push({ k: d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate(), c: cl[i] / div });
      }
      return out.length ? out : null;
    } catch { return null; }
  }
  async function fetchDaily(sym) {
    const yUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(sym) + "?interval=1d&range=2mo";

  let weekBusy = false;
  async function ensureWeekBase() {
    if (weekBusy) return;
    const anchor = weekAnchorKey();
    // 要基准价的是「周初持有的仓位」, 不是「当前持仓」——
    // 周初持有、本周内又清掉的票(卖光了就不在当前持仓里)同样要算进本周收益,
    // 漏掉它们的话 pnlAt 会因为缺价一直返回 null, 本周收益就永远是"—"。
    // 反过来, 本周才建仓的票不需要基准价(它周初根本不存在)。
    const syms = [...new Set(
      CORE.aggregate(CORE.parseHoldings(holdingsText).lots.filter(l => l.dateKey > 0 && l.dateKey < anchor))
        .positions.filter(p => p.shares > 1e-9).map(p => p.sym)
    )];
    if (!syms.length) return;
    // 跨周(anchor 变了)就整份作废重取; 同一周内只补还没有基准价的代码(新建仓的)
    const px = weekBase.anchor === anchor ? asObj(weekBase.px) : {};
    const need = syms.filter(s => !(px[s] > 0));
    if (!need.length) {
      if (weekBase.anchor !== anchor) { weekBase = { anchor, px, at: Date.now() }; LS.set(K.weekbase, weekBase); }
      return;
    }
    weekBusy = true;
    try {
      const rs = await Promise.allSettled(need.map(s => fetchDaily(s)));
      let got = 0;
      rs.forEach((r, i) => {
        if (r.status !== "fulfilled" || !r.value) return;
        let pick = null;
        for (const b of r.value) if (b.k < anchor) pick = b; // 升序, 最后一个即本周一之前最近的交易日
        if (pick) { px[need[i]] = pick.c; got++; }
      });
      if (got) { weekBase = { anchor, px, at: Date.now() }; LS.set(K.weekbase, weekBase); render(); }
    } finally { weekBusy = false; }
  }

  // 后台补 sparkline (Finnhub 路径无历史; 不阻塞行情刷新, 半天补一次)

    if (sparksBusy) return;
    const HALF_DAY = 12 * 3600 * 1000;
    const need = syms.filter(s => {
      const q = quotes[s];
      return q && q.price > 0 && (!q.spark || Date.now() - (q.sparkTs || 0) > HALF_DAY);
    });
    if (!need.length) return;
    sparksBusy = true;
    try {
      const rs = await Promise.allSettled(need.map(s => fetchYahoo(s)));
      let got = 0;
      rs.forEach((r, i) => {
        if (r.status === "fulfilled" && r.value && r.value.spark) {
          const q = quotes[need[i]];
          if (q) { q.spark = r.value.spark; q.sparkTs = Date.now(); got++; } // 只并入历史, 实时价以 Finnhub 为准
        }
      });
      if (got) { LS.set(K.quotes, quotes); render(); }
    } finally { sparksBusy = false; }
  }

  async function refresh() {
    if (refreshing) { pendingRefresh = true; return; } // 进行中 → 排队, 完成后自动补一轮
    const parsed = CORE.parseHoldings(holdingsText);
    const { positions } = CORE.aggregate(parsed.lots);
    const syms = positions.map(p => p.sym);
    if (!syms.length) { render(); return; }
    refreshing = true;
    $("refreshBtn").classList.add("loading");
    $("refreshBtn").disabled = true;
    let ok = 0;
    try {
      const results = await Promise.allSettled(syms.map(s => fetchQuote(s)));
      results.forEach((r, i) => {
        if (r.status === "fulfilled" && r.value) {
          const old = quotes[syms[i]] || {};
          quotes[syms[i]] = {
            ...r.value,
            name: r.value.name || old.name || null,
            spark: r.value.spark || old.spark || null,
            sparkTs: r.value.spark ? Date.now() : (old.sparkTs || 0),
            ts: Date.now(),
          };
          delete manual[syms[i]]; // 拿到真报价后, 之前的手动应急价作废
          ok++;
        }
      });
      LS.set(K.quotes, quotes);
      LS.set(K.manual, manual);
      if (ok === 0) toast("行情获取失败：稍后再点「刷新」，或点行内 ✎ 手动输价"); // 应用里没有"设置"页, 别再叫用户去一个点不到的地方
    } finally {
      refreshing = false;
      $("refreshBtn").classList.remove("loading");
      $("refreshBtn").disabled = false;
      render();
      if (ok > 0 && !document.body.classList.contains("boot")) {
        // 新行情到达 → 点阵数字闪现一次
        document.body.classList.add("tick");
        setTimeout(() => document.body.classList.remove("tick"), 900);
      }
      if (ok > 0) refreshSparks(syms); // 后台补 30 日走势, 不阻塞
      if (usMarketActiveish()) refreshExtended(syms); // 只在美股有交易的时段拉盘前盘后, 休市/周末不空转烧额度
      ensureWeekBase();                // 后台补"本周收益"的基准价(上周五收盘), 不阻塞
      refreshEarnings(syms);           // 后台补财报日历, 不阻塞
      refreshAiSectors();              // 后台问 Gemini 补板块归类, 不阻塞
      if (pendingRefresh) { pendingRefresh = false; refresh(); }
    }
  }

  /* ---- 生效报价 ----
     手动价在“最近一次成功抓取之后录入”时优先(成功抓取会清手动价, 即手动价只在抓取失败期间生效);
     否则用抓取价, 超 24h 标 stale。手动价币种沿用最后已知币种/代码后缀推断, 绝不硬编码 USD。 */
  function effectiveQuotes(syms) {
    const out = {};
    const now = Date.now(), STALE = 24 * 3600 * 1000;
    for (const s of syms) {
      const q = quotes[s], m = manual[s];
      if (m && m.price > 0 && (!q || !(q.price > 0) || (m.ts || 0) > (q.ts || 0))) {
        out[s] = { price: m.price, prevClose: null, currency: (q && q.currency) || CORE.inferCurrency(s), name: (q && q.name) || null, spark: (q && q.spark) || null, manual: true };
      } else if (q && q.price > 0) {
        // 盘前/盘后覆盖: 现价用延时成交价, 主涨幅保持"相对昨收的全天口径"(券商惯例),
        // 盘前盘后自身的漂移放进 extPct 由小标单独展示
        const e = (q.ext && q.ext.price > 0 && now - (q.ext.at || 0) < 15 * 60 * 1000) ? q.ext : null;
        out[s] = e
          ? { ...q, price: e.price, ext: e.kind, extPct: e.prev > 0 ? (e.price - e.prev) / e.prev : null }
          : { ...q, stale: now - (q.ts || 0) > STALE };
      }
    }
    return out;
  }

  /* ---- 渲染 ---- */
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pnlCls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
  const arrow = v => v > 0 ? "▲" : v < 0 ? "▼" : "";

  /* ---- 点阵数字: 5x7 字模 → SVG 圆点 (fill=currentColor 继承涨跌色) ---- */
  const DOT_FONT = {
    "0": ["01110","10001","10011","10101","11001","10001","01110"],
    "1": ["00100","01100","00100","00100","00100","00100","01110"],
    "2": ["01110","10001","00001","00110","01000","10000","11111"],
    "3": ["11111","00010","00100","00010","00001","10001","01110"],
    "4": ["00010","00110","01010","10010","11111","00010","00010"],
    "5": ["11111","10000","11110","00001","00001","10001","01110"],
    "6": ["00110","01000","10000","11110","10001","10001","01110"],
    "7": ["11111","00001","00010","00100","01000","01000","01000"],
    "8": ["01110","10001","10001","01110","10001","10001","01110"],
    "9": ["01110","10001","10001","01111","00001","00010","01100"],
    "A": ["01110","10001","10001","11111","10001","10001","10001"],
    "B": ["11110","10001","10001","11110","10001","10001","11110"],
    "C": ["01110","10001","10000","10000","10000","10001","01110"],
    "D": ["11100","10010","10001","10001","10001","10010","11100"],
    "E": ["11111","10000","10000","11110","10000","10000","11111"],
    "F": ["11111","10000","10000","11110","10000","10000","10000"],
    "G": ["01110","10001","10000","10111","10001","10001","01111"],
    "H": ["10001","10001","10001","11111","10001","10001","10001"],
    "I": ["01110","00100","00100","00100","00100","00100","01110"],
    "J": ["00111","00010","00010","00010","00010","10010","01100"],
    "K": ["10001","10010","10100","11000","10100","10010","10001"],
    "L": ["10000","10000","10000","10000","10000","10000","11111"],
    "M": ["10001","11011","10101","10101","10001","10001","10001"],
    "N": ["10001","10001","11001","10101","10011","10001","10001"],
    "O": ["01110","10001","10001","10001","10001","10001","01110"],
    "P": ["11110","10001","10001","11110","10000","10000","10000"],
    "Q": ["01110","10001","10001","10001","10101","10010","01101"],
    "R": ["11110","10001","10001","11110","10100","10010","10001"],
    "S": ["01111","10000","10000","01110","00001","00001","11110"],
    "T": ["11111","00100","00100","00100","00100","00100","00100"],
    "U": ["10001","10001","10001","10001","10001","10001","01110"],
    "V": ["10001","10001","10001","10001","10001","01010","00100"],
    "W": ["10001","10001","10001","10101","10101","11011","10001"],
    "X": ["10001","10001","01010","00100","01010","10001","10001"],
    "Y": ["10001","10001","01010","00100","00100","00100","00100"],
    "Z": ["11111","00001","00010","00100","01000","10000","11111"],
    "$": ["00100","01111","10100","01110","00101","11110","00100"],
    "%": ["11000","11001","00010","00100","01000","10011","00011"],
    "+": ["00000","00100","00100","11111","00100","00100","00000"],
    "-": ["0000","0000","0000","1111","0000","0000","0000"],
    ".": ["00","00","00","00","00","11","11"],
    ",": ["00","00","00","00","01","01","10"],
    "/": ["00001","00010","00100","00100","00100","01000","10000"],
    " ": ["00","00","00","00","00","00","00"],
    "¥": ["10001","01010","00100","11111","00100","11111","00100"],
    "£": ["00110","01001","01000","11110","01000","01000","11111"],
    "€": ["00110","01001","11100","01000","11100","01001","00110"],
    "^": ["00100","01010","10001","00000","00000","00000","00000"],
    "=": ["00000","00000","11111","00000","11111","00000","00000"],
  };
  function dotText(str, pitch, sparkle) {
    const s = String(str);
    const chars = [...s.toUpperCase()].map(c => c === "−" ? "-" : c);
    if (!chars.length || !chars.every(c => DOT_FONT[c])) return esc(s); // 字模外字符(中文/—等) → 普通文本回退
    const r = pitch * 0.36;
    let x = 0; const dots = [];
    for (const c of chars) {
      const g = DOT_FONT[c], w = g[0].length;
      for (let row = 0; row < 7; row++)
        for (let col = 0; col < w; col++)
          if (g[row][col] === "1")
            dots.push(`<circle cx="${((x + col + 0.5) * pitch).toFixed(2)}" cy="${((row + 0.5) * pitch).toFixed(2)}" r="${r.toFixed(2)}"${sparkle ? ` style="animation-delay:${(Math.random() * 380) | 0}ms"` : ""}/>`);
      x += w + 1;
    }
    const wpx = ((x - 1) * pitch).toFixed(2), hpx = (7 * pitch).toFixed(2);
    return `<svg class="dotnum" role="img" aria-label="${esc(s)}" viewBox="0 0 ${wpx} ${hpx}" width="${wpx}" height="${hpx}" fill="currentColor">${dots.join("")}</svg>`;
  }

  let firstRenderDone = false;
  function render() {
    // 首次渲染之后的任何重渲染都结束入场窗口, 否则 boot 窗内的数据到达/交互会把入场动画整套重放
    if (firstRenderDone) document.body.classList.remove("boot");
    firstRenderDone = true;
    const now = new Date();
    const todayKey = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
    const parsed = CORE.parseHoldings(holdingsText);
    const agg = CORE.aggregate(parsed.lots, todayKey);
    const q = effectiveQuotes(agg.positions.map(p => p.sym));
    const view = CORE.computeView(agg.positions, q);
    attachWeekPnl(parsed, view);

    renderBanner(parsed, agg, view);
    renderTiles(view);
    renderStructure(view);
    renderSectorBar(view);
    renderHoldings(view, q);
    renderPnlChart(view);

    const tsList = Object.values(quotes).map(x => x.ts || 0).filter(Boolean);
    if (tsList.length) {
      const d = new Date(Math.max(...tsList));
      const dayPrefix = d.toDateString() === now.toDateString() ? "" : (d.getMonth() + 1) + "/" + d.getDate() + " ";
      $("updated").textContent = "行情 " + dayPrefix + d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    } else $("updated").textContent = "";
  }

  /* 本周收益: 现在的总盈亏 − 上周五收盘时的总盈亏。
     期间的买卖不会污染它(建仓瞬间浮盈为 0, 卖出瞬间浮盈转已实现, 总盈亏都不变),
     所以差值就是这一周价格真正走出来的钱。基准价没取到 → 留 null, UI 显示「—」。 */
  function attachWeekPnl(parsed, view) {
    const anchor = weekAnchorKey();
    if (weekBase.anchor !== anchor) return;         // 跨周了, 基准还没重取
    for (const cur of Object.keys(view.totals)) {
      const t = view.totals[cur];
      if (t.totalPnl == null) continue;
      // 只拿本币种的代码去倒推, 免得多币种混着加
      const symOk = s => ((quotes[s] && quotes[s].currency) || CORE.inferCurrency(s)) === cur;
      const base = CORE.pnlAt(parsed.lots, anchor, weekBase.px, symOk);
      if (base) {
        t.weekPnl = t.totalPnl - base.pnl;
        // 涨跌% 对周初市值算(和「今日」对昨收市值算同一口径), 周初空仓则不给%
        t.weekPct = base.value > 0 ? t.weekPnl / base.value : null;
      }
    }
  }

  function renderBanner(parsed, agg, view) {
    const parts = [];
    if (pendingImport != null) {
      parts.push(
        `<div class="banner">这条链接携带了一份持仓数据，与本机已保存的不同。要用哪份？` +
        `<div class="actions"><button class="primary" id="useImportBtn">用链接里的</button>` +
        `<button id="keepLocalBtn">保留本机的</button></div></div>`);
    }
    if (view.missing.length)
      parts.push(`<div class="banner">⚠️ ${view.missing.map(esc).join("、")} 暂无报价（未计入汇总）。点该行的「输入价格」可手动输入。</div>`);
    if (agg.warnings.length)
      parts.push(`<div class="banner">⚠️ ${agg.warnings.map(esc).join("<br>")}</div>`);
    if (parsed.warnings.length)
      parts.push(`<div class="banner">⚠️ ${parsed.warnings.map(esc).join("<br>")}</div>`);
    $("banner").innerHTML = parts.join("");
    const ui = $("useImportBtn"), kl = $("keepLocalBtn");
    if (ui) ui.onclick = () => {
      const pl = pendingImport; pendingImport = null;
      applyImport(pl);
      refresh();
    };
    if (kl) kl.onclick = () => { pendingImport = null; try { history.replaceState(null, "", location.pathname + location.search); } catch {} render(); };
  }

  function renderTiles(view) {
    const curs = Object.keys(view.totals);
    if (!curs.length) {
      // 区分“还没记持仓”和“有持仓但一个报价都没拿到”
      $("tiles").innerHTML = view.rows.length
        ? `<div class="tile hero"><div class="label">总盈亏</div><div class="value">—</div><div class="delta">暂无行情：点「刷新」重试，或点下方各行「输入价格」手动填</div></div>`
        : `<div class="tile hero"><div class="label">总盈亏</div><div class="value">—</div><div class="delta">用下方「记一笔」添加第一笔交易</div></div>`;
      return;
    }
    // 主币种 = 市值最大的; 其他币种在角标注明
    curs.sort((a, b) => view.totals[b].value - view.totals[a].value);
    const main = curs[0], t = view.totals[main];
    const others = curs.slice(1);
    const M = (v, o) => CORE.fmtMoney(v, main, o), P = CORE.fmtPct;
    // 视觉层级: L1 总盈亏 / L2 本周·今日 都在上面的 hero 里, 这里是 L3 —— 只放构成分项。
    // 分项不再重复给合计, 免得两处数字对不上眼。
    const tiles = [
      `<div class="tile"><div class="label">已实现盈亏（已落袋）</div>
        <div class="value ${pnlCls(t.realized)}">${dotText(M(t.realized, { signed: true }), 4, true)}</div></div>`,
      `<div class="tile"><div class="label">未实现盈亏（浮动）</div>
        <div class="value ${pnlCls(t.unreal)}">${dotText(M(t.unreal, { signed: true }), 4, true)}</div>
        <div class="delta ${pnlCls(t.unreal)}">${P(t.unrealPct)}</div></div>`,
    ];
    // 其他币种各补一行小计
    for (const c of others) {
      const o = view.totals[c];
      tiles.push(`<div class="tile"><div class="label">${esc(c)} 小计</div>
        <div class="value">${dotText(CORE.fmtMoney(o.value, c), 4)}</div>
        <div class="delta ${pnlCls(o.unreal)}">${CORE.fmtMoney(o.unreal, c, { signed: true })}（${P(o.unrealPct)}）</div></div>`);
    }
    $("tiles").innerHTML = tiles.join("");
  }

  /* ---- 主视觉: 毛玻璃渐变球 + 总盈亏(含波动) ----
     只呈现主币种(市值最大的那个桶): 占比是分币种算的, 混币种会把
     "某外币里的 100%" 当成全组合最大仓, 球径全错 */
  // 球群槽位, 按各自画布铺开(坐标是画布内的百分比):
  // 桌面画布 = hero 的右半边(竖高), 手机画布 = 数字下方一条 200px 的横带(扁宽)
  const ORB_SLOTS = [[50, 48], [76, 72], [30, 22], [86, 30], [18, 74], [62, 10], [8, 42], [93, 58]];
  const ORB_SLOTS_M = [[16, 50], [38, 26], [58, 68], [77, 34], [92, 62], [28, 80], [48, 12], [68, 88]];
  const orbLayoutMobile = () => window.innerWidth < 900;
  function renderStructure(view) {
    const el = $("structure");
    const curs = Object.keys(view.totals).sort((a, b) => view.totals[b].value - view.totals[a].value);
    const mainCur = curs[0];
    // ★ 只有"完全没有任何数据"(既没有当前持仓也没有已清仓的历史)才整块隐藏。之前这里拿
    // "有没有当前持仓可以画球"当整个 hero(含总盈亏/本周/今日)的开关——全部清仓、只剩
    // 已实现盈亏的账户(比如刚清空仓位那几天), view.rows 是空的但 view.totals 里明明有
    // 数据, 却被这行连累成整块空白, 一个数字都看不到。球群画不画是另一件事, 不该共用这个开关。
    if (mainCur == null) { el.style.display = "none"; el.innerHTML = ""; return; }
    el.style.display = "";
    const all = view.rows.filter(r => r.value != null && r.alloc > 0 && r.cur === mainCur);
    // 持仓多时海报不许乱: 只画最大的 7 只, 其余聚合成一颗「其他」球 (大小=合计占比, 颜色=合计盈亏)
    const MAXORB = 7;
    let rows = all;
    if (all.length > MAXORB) {
      const rest = all.slice(MAXORB);
      const restCost = rest.reduce((s, r) => s + r.cost, 0);
      const restUnreal = rest.reduce((s, r) => s + r.unreal, 0);
      rows = all.slice(0, MAXORB).concat([{
        sym: "其他", otherCount: rest.length,
        value: rest.reduce((s, r) => s + r.value, 0),
        alloc: rest.reduce((s, r) => s + r.alloc, 0),
        unreal: restUnreal,
        unrealPct: restCost > 0 ? restUnreal / restCost : 0,
        cur: mainCur,
      }]);
    }
    const t = view.totals[mainCur];
    const mob = orbLayoutMobile();
    const orbs = [], callouts = [];
    if (rows.length) {
      const maxA = Math.max(...rows.map(r => r.alloc));
      const slots = mob ? ORB_SLOTS_M : ORB_SLOTS;
      // 最大球半径(% 画布宽)。手机画布只有 200px 高但很宽, 半径按宽度算容易撑破上下边, 所以压小
      const RMAX = mob ? 11 : 13;
      rows.forEach((r, i) => {
        const [x, y] = slots[i];
        const rad = Math.min(RMAX, Math.max(3.5, RMAX * Math.sqrt(r.alloc / maxA)));
        const cls = r.unreal > 0 ? "pos-orb" : r.unreal < 0 ? "neg-orb" : "flat-orb";
        const op = (0.55 + Math.min(0.45, Math.abs(r.unrealPct || 0) * 3)).toFixed(2);
        const label = r.otherCount ? `其他 ${r.otherCount} 只` : r.sym;
        const tip = `${label} · 市值 ${CORE.fmtMoney(r.value, r.cur)} · ${r.unreal >= 0 ? "盈" : "亏"} ${CORE.fmtPct(Math.abs(r.unrealPct), false)}`;
        orbs.push(`<button class="orb" data-idx="${i}" data-row="${r.otherCount ? "" : esc(r.sym)}" data-tip="${esc(tip)}" aria-label="${esc(tip)}，点击查看该行"
          style="left:${x}%;top:${y}%;width:${(rad * 2).toFixed(1)}%;opacity:${op}"><i class="orb-vis ${cls}" style="--d:${i * 90}ms"></i></button>`);
        if (i < 3) {
          callouts.push(`<div class="callout" data-orb="${i}">
            <div class="pct">${(r.alloc * 100).toFixed(0)}<span class="pctsign">%</span></div>
            <div class="cap">${esc(r.sym)} 占比</div></div>`);
        }
      });
    }
    /* 三级视觉层级 (Mercury/Linear 的做法: 一个绝对主角, 其余按重要性递减):
         L1 总盈亏  —— 点阵巨数, 全页最大
         L2 本周/今日 —— 并排两栏, 中号
         L3 已实现/未实现 —— 下面的统计条(renderTiles)
       只放跟"本金算多少"无关的绝对数字; 总市值/总成本那类依赖本金基准的滚仓后会失真, 已去掉。 */
    const M = (v, o) => CORE.fmtMoney(v, mainCur, o);
    const splitCell = (label, pnl, pct, note) => `
          <div class="split">
            <div class="eyebrow">${label}</div>
            <div class="split-fig ${pnl == null ? "" : pnlCls(pnl)}">${pnl == null ? "—" : M(pnl, { signed: true })}</div>
            <div class="split-sub ${pnl == null ? "" : pnlCls(pnl)}">${pct == null ? "" : CORE.fmtPct(pct)}</div>
            ${note ? `<div class="split-note">${note}</div>` : ""}
          </div>`;
    const dayNote = [
      view.rows.some(r => r.quote && r.quote.ext) ? "含盘前后" : "",
      t.dayPartial > 0 ? `不含 ${t.dayPartial} 项` : "",
    ].filter(Boolean).join(" · ");
    // ★ totalPct 会是 null 的情况: 净投入本金 <=0, 典型是"净卖出者"(赚了钱、提走的比放进去的多)。
    // 这只影响那一个百分比, 不该连累总盈亏的金额、更不该连累本周/今日(它们跟 invested 毫无关系)——
    // 之前这一整块用 t.totalPct==null 兜底成空字符串, 净卖出者会连本周/今日一起在首屏彻底消失。
    const totalPctHtml = t.totalPct == null ? "" : `<b class="${pnlCls(t.totalPnl)}">${CORE.fmtPct(t.totalPct)}</b><span class="sep">·</span>`;
    const heroBlock = `
        <div class="hero-total">
          <div class="eyebrow">总盈亏 · 已实现 + 未实现</div>
          <div class="hero-fig ${pnlCls(t.totalPnl)}">${dotText(M(t.totalPnl, { signed: true }), 5.4, true)}</div>
          <div class="hero-meta">
            ${totalPctHtml}已实现 ${M(t.realized, { signed: true })}<span class="sep">·</span>未实现 ${M(t.unreal, { signed: true })}
          </div>
        </div>
        <div class="hero-splits">

        ${heroBlock}
      </div>
      <div class="s-field">
        ${mob ? "" : `<div class="s-decor" style="left:52%;top:50%;width:78%"></div>
        <div class="s-decor" style="left:28%;top:26%;width:32%"></div>`}

    const placeCallouts = () => {
      const fr = field.getBoundingClientRect();
      if (!fr.width) return;
      el.querySelectorAll(".callout").forEach(c => {
        const orb = el.querySelector(`.orb[data-idx="${c.dataset.orb}"]`);
        if (!orb) return;
        const or = orb.getBoundingClientRect();
        const ch = c.offsetHeight || 44, cw = c.offsetWidth || 90;
        const cx = Math.min(Math.max(or.left - fr.left + or.width / 2, cw / 2 + 4), fr.width - cw / 2 - 4);
        const cy = Math.min(Math.max(or.top - fr.top + or.height / 2 - ch / 2, 4), fr.height - ch - 4);
        c.style.left = cx.toFixed(0) + "px";
        c.style.top = cy.toFixed(0) + "px";
        c.style.visibility = "visible";
      });

    requestAnimationFrame(placeCallouts);
    el.querySelectorAll(".orb").forEach(orb => {
      const show = () => {

        tip.hidden = false;

        const half = tip.offsetWidth / 2 + 4; // 实测气泡宽度再夹, 长文案不许溢出
        tip.style.left = Math.min(Math.max(or.left - fr.left + or.width / 2, half), fr.width - half) + "px";
        tip.style.top = Math.max(or.top - fr.top, 30) + "px";
      };
      const hide = () => { tip.hidden = true; };
      orb.addEventListener("mouseenter", show);
      orb.addEventListener("mouseleave", hide);
      orb.addEventListener("focus", show);
      orb.addEventListener("blur", hide);
      orb.addEventListener("click", () => {
        hide(); // 触屏上点击后气泡不许滞留
        // 「其他」聚合球 → 滚到明细列表; 普通球 → 滚到对应行
        const row = orb.dataset.row
          ? $("holdings").querySelector(`.hrow[data-sym="${CSS.escape(orb.dataset.row)}"]`)

        row.classList.add("flash");
        row.addEventListener("animationend", () => row.classList.remove("flash"), { once: true });
      });
    });
  }

  /* ---- 板块: 手动标签优先, 常见代码自动归类, 都没有则「其他」 ---- */
